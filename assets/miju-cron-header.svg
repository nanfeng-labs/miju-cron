<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="680" viewBox="0 0 1600 680" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">miju-cron</title>
  <desc id="desc">An orange miju-cron wordmark with the citrus organization mark, white sticker outlines, and a small clock with a circular arrow representing recurring task scheduling.</desc>
