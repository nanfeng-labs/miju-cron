  <g transform="translate(144 0) scale(.82)">

  <g transform="translate(0 -20)">
  <!-- A loose dotted orbit suggests tasks moving through a workflow. -->
  <path d="M 250,317 C 259,156 478,124 660,148 M 978,155 C 1133,118 1365,161 1372,295 C 1381,429 1198,523 1037,517 M 701,517 C 513,538 300,474 251,383" stroke="#FFCE8B" stroke-width="4" stroke-linecap="round" stroke-dasharray="13 24"/>

  <!-- Solid offset contours retain the sticker effect at small sizes. -->
  <rect x="270" y="110" width="1020" height="485" fill="url(#edge)" mask="url(#letter-shadow)"/>
  <use xlink:href="#letters" fill="#FFF" stroke="#FFF" stroke-width="56" stroke-linejoin="round"/>
  <rect x="290" y="130" width="990" height="440" fill="url(#citrus)" mask="url(#letter-face)"/>

  <!-- The organization citrus mark becomes the dot of the i. -->
  <g transform="translate(770 154) rotate(-12)">
    <circle cy="12" r="83" fill="#FFAD3C"/>
    <circle r="83" fill="#FFF"/>
    <use xlink:href="#orange"/>
  </g>

  <!-- A small unframed code sticker keeps the wordmark dominant. -->
  <g transform="translate(213 220) rotate(-14 50 50) scale(.92)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#code-accent" transform="translate(0 4)" stroke="#FFD99B" stroke-width="23"/>
    <use xlink:href="#code-accent" stroke="#FFF" stroke-width="23"/>
    <use xlink:href="#code-accent" stroke="#FFB14E" stroke-width="11"/>
  </g>

  <!-- A clock and circular arrow represent recurring schedules. -->
  <g transform="translate(1300 225) rotate(12 50 50) scale(.90)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#package-accent" transform="translate(0 4)" stroke="#FFD99B" stroke-width="21"/>
    <use xlink:href="#package-accent" stroke="#FFF" stroke-width="21"/>
    <circle cx="50.641" cy="52" r="32" fill="#FFF4D4"/>
    <use xlink:href="#package-accent" stroke="#FFB14E" stroke-width="8"/>
    <path d="M 52,27 V 50 L 68,60" stroke="#FFA347" stroke-width="8"/>
    <circle cx="52" cy="50" r="4" fill="#FFD166"/>
  </g>

  <!-- Small citrus-colored accents. -->
  <path d="M 247,165 239,141 M 277,161 284,135" stroke="#FFC575" stroke-width="6" stroke-linecap="round"/>
  <path d="M 1286,176 1290,151 M 1314,185 1331,167" stroke="#FFC575" stroke-width="6" stroke-linecap="round"/>
  <path d="M 603,113 608,95 M 624,122 640,113" stroke="#FFCB7D" stroke-width="6" stroke-linecap="round"/>
  <path d="M 329,402 338,415 354,419 341,428 337,444 328,431 312,427 325,418 Z" fill="#FFBD44"/>
  <path d="M 1253,416 1259,427 1272,432 1260,438 1256,451 1249,439 1237,435 1249,429 Z" fill="#FFA13B"/>
  <circle cx="1172" cy="158" r="6" fill="#FFC74B"/>
  <circle cx="419" cy="510" r="6" fill="#FFB648"/>
  </g>
  </g>

  <!-- The package suffix shares the wordmark's citrus fill and sticker contours. -->
  <g aria-label="cron" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#package-letters" transform="translate(0 10)" fill="url(#package-edge)" stroke="url(#package-edge)" stroke-width="30"/>
    <use xlink:href="#package-letters" fill="#FFF" stroke="#FFF" stroke-width="30"/>
    <use xlink:href="#package-letters" fill="url(#package-citrus)" stroke="url(#package-citrus)" stroke-width="6"/>
  </g>
</svg>
