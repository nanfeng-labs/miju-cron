    <linearGradient id="package-citrus" x1="578.719" y1="465" x2="1021.281" y2="575" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB52C"/>
      <stop offset=".47" stop-color="#FF9A24"/>
      <stop offset="1" stop-color="#FF753F"/>
    </linearGradient>
    <linearGradient id="package-edge" x1="578.719" y1="465" x2="1021.281" y2="575" gradientUnits="userSpaceOnUse">
