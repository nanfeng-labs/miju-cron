[[audits.phf_shared]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.11.3"
notes = "Reviewed full library source and normalized manifest, comparing all three resolved versions. Hashing delegates to SipHasher; displacement arithmetic explicitly wraps; indexing and modulo can panic for invalid caller-supplied tables but use checked Rust accesses. Borrow implementations preserve references; formatting uses Debug for strings/primitive values. No unsafe code, IO or build scripts. Dependency audits remain separate. This is a security review, not a guarantee of cross-architecture hash or arbitrary custom FmtConst correctness."

