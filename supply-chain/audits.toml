[[audits.regex-syntax]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
delta = "0.8.5 -> 0.8.11"
notes = "Reviewed published source and manifest delta. Interval insertion preserves sorted disjoint ranges by merging the preceding and subsequent contiguous ranges with checked vector accesses; a seeded 1024-round public API probe compared every insertion against an independent 256-bit membership oracle. Unicode class translation now accounts for double negation. Other source changes are formatting/documentation; no new unsafe code, build scripts or dependencies. Target archive checksum matches Cargo.lock and extracted files match archive. Dependency-local Cargo.lock excluded from source delta."

[[audits.tracing-attributes]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
delta = "0.1.30 -> 0.1.31"
notes = "Reviewed source/manifests/tests delta and FieldName consumers. New braced expressions are parsed by syn and emitted using quote token APIs, preserving dotted identifiers. Duplicate expression field names are intentionally not deduplicated and documented. Removed AsyncTraitBlockReplacer had no call sites. No new build script, runtime IO, unsafe code or dependency changes. Macro tests inspected, not executed independently."
