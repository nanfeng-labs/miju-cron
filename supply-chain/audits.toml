
# cargo-vet audits file

[[audits.android_system_properties]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
delta = "0.1.5 -> 0.1.6"
notes = "Reviewed complete package delta and callback call sites. Corrects C callback ABI and void return to match Android system_properties.h; cookie points to a live local Option<String> during synchronous callback. Invalid UTF-8 now returns None without unwinding through C. No new runtime dependencies or build script. Android device execution not performed."

[[audits.autocfg]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
delta = "1.5.0 -> 1.5.1"
notes = "Reviewed complete published-package delta: library sources unchanged; wrapper test replaces a shell fixture with its own harness-free executable, drains stdin, and confines environment changes to the test process. Manifest changes only declare existing tests and harness=false; no new runtime dependencies or build script."

[[audits.fastrand]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
delta = "2.3.0 -> 2.5.0"
notes = "Reviewed package source/manifests/tests delta: float generation uses finite scaled 63-bit integers, exclusive APIs reject rounded 1.0; no new unsafe code. Existing thread-local access retained. WASM entropy call updated to getrandom::fill with errors still propagated to existing fallback; dependency separately vetted. Not a cryptographic RNG. Source review plus seeded public range probe; no WASM runtime execution."

[[audits.jiff-static]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.2.38"
notes = "Reviewed complete macro source and both manifests. include reads only an explicit source-supplied path; get uses bundled TZif data. All values are emitted through quote as literals and static structures; parsing is delegated to dependencies that require separate audits. Checked generated unsafe copy against matching jiff 0.2.38 constructor, pointer tag and Drop implementation: its static TZif representation owns no Arc and remains valid after copies are dropped. Public macro probe passed 2000 clone/drop/offset checks across winter and summer dates. No network, process execution, file writes or build script. Does not certify timezone data accuracy or the separate jiff-core parser."

[[audits.jiff-tzdb]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.1.9"
notes = "Reviewed full executable Rust and manifest. no_std static TZif data lookup, checked slicing, case-insensitive binary search and slice iterator; no unsafe, build script, IO or dependencies. Validated all 598 generated table entries for unique case-insensitive ordering, range bounds, and successful independent Python zoneinfo TZif parsing. Does not certify historical timezone accuracy or future government rule changes."

[[audits.jiff-tzdb-platform]]
who = "Codex (AI-assisted source review)"
criteria = "safe-to-deploy"
version = "0.1.3"
notes = "Full crate review: no_std wrapper containing only a public re-export of jiff_tzdb. Manifest disables build scripts and extra targets; no executable logic or unsafe code. The separately resolved jiff-tzdb dependency still requires its own audit."

